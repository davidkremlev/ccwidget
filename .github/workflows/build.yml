name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only, explicitly.
#
# In a public repository anybody can open a pull request, and `pull_request`
# runs this workflow against their branch. The default token permissions are
# whatever the account's settings say; naming them here means a fork's build
# cannot write to this repository whatever those settings are. Nothing in this
# workflow needs more — it builds, checks and uploads artifacts.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Both ends of the supported range. The minimum in README and project.yml
    # was an assumption until this job existed: nothing had ever compiled, let
    # alone run, against macOS 14.
    #
    # What this proves and what it does not. On the 14 runner the checks
    # execute against the real 14 runtime, so an API that is unavailable there
    # fails here rather than on a user's machine. It says nothing about the
    # widget: WidgetKit needs a desktop and a logged-in session, and the views
    # have no coverage at all (see the coverage summary). The widget has only
    # ever been run by hand, on macOS 26.
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          # SPEC section 5: the documented minimum may never be lower than
          # what CI checks. This image is unsupported from 2 November 2026 —
          # on that date the minimum rises to whatever image still exists,
          # here and in project.yml and README together. That decision is
          # already made; only the edit is outstanding.
          - os: macos-14
            label: macOS 14 (minimum supported)
            # 15.4 is the default on this image and predates Swift 6.
            developer_dir: /Applications/Xcode_16.2.app/Contents/Developer
            primary: false
          - os: macos-latest
            label: macOS 26 (current)
            developer_dir: ""
            primary: true

    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          # Which Xcodes the image carries at all. The matrix pins one of them
          # by DEVELOPER_DIR, and what else is available decides whether a
          # toolchain-dependent step — the icon, see Docs/state-2026-08-16.md
          # finding 12 — could be built here even in principle.
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "(no Xcode in /Applications)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: |
          xcodegen generate
          # A committed .xcodeproj would shadow the generated one and quietly
          # go stale. Catch it here rather than when someone's new file fails
          # to compile for everyone else.
          if git ls-files --error-unmatch CCWidget.xcodeproj >/dev/null 2>&1; then
            echo "::error::CCWidget.xcodeproj is committed; it is generated from project.yml"
            exit 1
          fi

      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild \
            -project CCWidget.xcodeproj \
            -scheme CCWidget \
            -configuration Release \
            -derivedDataPath .build/dd \
            build \
            | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Fail on warnings
        run: |
          # The build is warning-free today. A new warning is a regression,
          # not a note — it gets caught here rather than in review.
          if grep -q "warning:" build.log; then
            echo "::error::the build produced warnings"
            grep "warning:" build.log
            exit 1
          fi

      - name: Check the bundle is complete
        run: |
          APP=.build/dd/Build/Products/Release/CCWidget.app
          test -d "$APP/Contents/PlugIns/CCWidgetExtension.appex" \
            || { echo "::error::widget extension missing from the bundle"; exit 1; }
          test -f "$APP/Contents/Resources/ccwidget-export.py.template" \
            || { echo "::error::exporter template missing from the bundle"; exit 1; }
          # The uninstaller ships inside the bundle because that is what a
          # Homebrew cask runs when somebody types `brew uninstall`. Missing, the
          # cask deletes the app and leaves a statusLine pointing at a file that
          # is gone — a broken prompt on every redraw, caused by uninstalling.
          test -x "$APP/Contents/Resources/uninstall.sh" \
            || { echo "::error::uninstall.sh missing from the bundle, or not executable"; exit 1; }
          # The icon is compiled from CCWidget.icon by actool, not copied. Both
          # products matter and both can go missing without the build saying a
          # word: Assets.car is what macOS 26 draws, CCWidget.icns is the
          # standalone copy older surfaces fall back to. The .icns arrives by
          # default rather than by a setting we pin, which is exactly the kind
          # of thing that changes under you between Xcode releases.
          #
          # Which toolchain is running decides whether their absence is a
          # defect. Icon Composer's .icon format is compiled by Xcode 26, and
          # Xcode 26 needs macOS 15.6 or later (Apple's release notes, in
          # SOURCES.md), so the minimum-OS runner tops out at 16.2 and produces
          # neither file. That is recorded as finding 12 in
          # Docs/state-2026-08-16.md and stated in the README; it is not
          # something this job can fix by failing.
          XCODE_MAJOR=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "${XCODE_MAJOR:-0}" -ge 26 ]; then
            test -f "$APP/Contents/Resources/Assets.car" \
              || { echo "::error::compiled icon missing from the bundle"; exit 1; }
            test -f "$APP/Contents/Resources/CCWidget.icns" \
              || { echo "::error::standalone .icns missing from the bundle"; exit 1; }
            echo "icon products present, built by Xcode $XCODE_MAJOR"
          else
            echo "::notice::Xcode $XCODE_MAJOR builds no icon from CCWidget.icon — an app built here has none. Finding 12."
            if [ -f "$APP/Contents/Resources/Assets.car" ]; then
              echo "::notice::Assets.car is present after all: finding 12 may be stale, go and re-read it."
            fi
          fi
          for lang in en de es ja ru zh-Hans; do
            test -d "$APP/Contents/Resources/$lang.lproj" \
              || { echo "::error::missing localization: $lang"; exit 1; }
          done

      - name: Check the version is one number, not four
        run: |
          # It used to live in project.yml and, as a literal, in both
          # Info.plists — which override it, so the two in project.yml did
          # nothing and the two literals had to be edited together and by hand.
          # The plists take the build setting now, and this makes sure they
          # keep taking it: an app and an extension that disagree about their
          # version are a class of bug nobody enjoys finding on a user's Mac.
          APP=.build/dd/Build/Products/Release/CCWidget.app
          DECLARED=$(awk -F'"' '/MARKETING_VERSION:/ { print $2 }' project.yml)
          for plist in "$APP/Contents/Info.plist" \
                       "$APP/Contents/PlugIns/CCWidgetExtension.appex/Contents/Info.plist"; do
            BUILT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$plist")
            if [ "$BUILT" != "$DECLARED" ]; then
              echo "::error::$plist says $BUILT, project.yml says $DECLARED"
              exit 1
            fi
          done
          echo "version $DECLARED, in the app and the extension alike"

      - name: Check the deployment target is what we claim
        run: |
          # The claim in README is a number in project.yml, and a number in a
          # config file is exactly the kind of thing that drifts silently.
          APP=.build/dd/Build/Products/Release/CCWidget.app
          FOUND=$(vtool -show-build "$APP/Contents/MacOS/CCWidget" \
                  | awk '/minos/ { print $2; exit }')
          if [ "$FOUND" != "14.0" ]; then
            echo "::error::built binary requires macOS $FOUND, but the documented minimum is 14.0"
            exit 1
          fi
          echo "minimum macOS in the built binary: $FOUND"

      - name: Run the checks
        run: |
          set -o pipefail
          xcodebuild \
            -project CCWidget.xcodeproj \
            -scheme CCWidget \
            -configuration Debug \
            -derivedDataPath .build/dd \
            -enableCodeCoverage YES \
            test \
            | tee test.log | grep -E "error:|✘|Test run|TEST" || true
          grep -q "TEST SUCCEEDED" test.log

      - name: Report coverage
        if: matrix.primary
        run: |
          # No threshold here on purpose. A number nobody agreed to is a
          # number that gets lowered the first time it is inconvenient; the
          # figure and the list of untouched files go in the job summary so
          # the decision is made deliberately rather than by a default.
          ./Scripts/coverage.sh --no-run | tee coverage.txt
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the console tools
        run: |
          swiftc -swift-version 6 -strict-concurrency=complete \
            -target arm64-apple-macos14.0 \
            Shared/Snapshot.swift Shared/SnapshotStore.swift \
            Shared/Formatters.swift Shared/Diagnostics.swift Shared/AgeClock.swift \
            Tools/ccwidget-dump/main.swift -o .build/ccwidget-dump
          # The replay tool is how the figures in Docs/estimate-review.md are
          # re-derived. A measurement nobody can repeat is an opinion, and the
          # tool going stale would quietly turn it back into one.
          swiftc -swift-version 6 -strict-concurrency=complete \
            -target arm64-apple-macos14.0 \
            Shared/Snapshot.swift Shared/SnapshotStore.swift \
            Shared/Formatters.swift Shared/Diagnostics.swift Shared/AgeClock.swift \
            Shared/HistoryStore.swift Shared/Forecast.swift \
            Tools/ccwidget-replay/main.swift -o .build/ccwidget-replay

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}
          path: |
            build.log
            test.log
            coverage.txt
            # Written beside a baseline that did not match. Without them a
            # failure here is a byte count in a log and nothing to compare:
            # the run that found the baselines do not reproduce could say
            # they differ and not by what.
            Tests/Baselines/*.actual
          retention-days: 7
          if-no-files-found: ignore

  source:
    # Checks about the source itself. They do not depend on a macOS version,
    # so running them twice would only double the time it takes to learn the
    # same thing.
    name: Source checks
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check nothing user-identifying is logged as public
        run: |
          # SPEC 6.1: paths, project names and raw values are .private.
          if grep -rnE '(path|Path|home|NSHomeDirectory|rawValue)[^)]*privacy: \.public' \
              --include="*.swift" App Shared Widget; then
            echo "::error::a user path or raw value is logged as .public"
            exit 1
          fi

      - name: Check for network code
        run: |
          # The README claims nothing leaves the machine. Keep that checkable.
          if grep -rnE "URLSession|NWConnection|CFStream|Network\.framework" \
              --include="*.swift" App Shared Widget; then
            echo "::error::network code found; the README says there is none"
            exit 1
          fi

      - name: Check the localization review document is current
        run: |
          # It is generated from the catalogs, and the README sends translators
          # to it. Regenerating is a step somebody has to remember, and once it
          # was not remembered: the document went a string short of the
          # catalogs, missing the very key it was asking people to review.
          # Remembering is not a mechanism.
          ./Scripts/localization-review.py
          if ! git diff --quiet -- Docs/localization-review.md; then
            echo "::error::Docs/localization-review.md is out of date — run ./Scripts/localization-review.py and commit the result"
            git diff -- Docs/localization-review.md
            exit 1
          fi

      - name: Check every catalog key is reachable from the code
        run: |
          # A key nobody can reach is text that gets translated into six
          # languages and shown to no one. Seven of them had accumulated
          # before this check existed.
          python3 - <<'PY'
          import json, pathlib, sys
          source = "".join(p.read_text()
                           for d in ("App", "Widget")
                           for p in pathlib.Path(d).rglob("*.swift"))
          dead = []
          for catalog in pathlib.Path(".").rglob("Localizable.xcstrings"):
              for key in json.loads(catalog.read_text())["strings"]:
                  # Look for the literal run before the first format specifier;
                  # anything after it is assembled at runtime.
                  stem = key.split("%")[0].strip()
                  if len(stem) >= 8 and stem not in source:
                      dead.append(f"{catalog}: {key}")
          if dead:
              print("::error::localization keys not referenced anywhere in the code")
              print("\n".join(dead))
              sys.exit(1)
          print("every catalog key is reachable")
          PY

      - name: Check the documentation sources
        run: |
          # Warns, never fails: a source past its date is a reason to re-read
          # it, not a reason to stop the build.
          #
          # What this proves here and what it does not. The cached documents
          # live in ~/Documents/refdocs on a developer's machine and are not
          # on this runner, so what runs here is only the half that needs no
          # store: that SOURCES.md still parses as a table and says how many
          # sources it claims. Staleness and drift between the table and the
          # store are caught by running this locally — the script says out
          # loud which half it skipped rather than passing in silence.
          ./Scripts/check-sources.py

      - name: Check the uninstaller removes only what is ours
        run: |
          # It edits a file it does not own and had no check of any kind until
          # a security review found it deciding ownership by substring. This
          # runs the real script against a stand-in HOME, one throwaway home
          # per state the status line can be in. Nothing outside that home is
          # touched: --purge, the one mode that reaches /Applications, is
          # never passed.
          ./Scripts/check-uninstall.sh

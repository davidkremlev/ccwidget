name: CCWidget

# The Xcode project is generated, not committed. A .pbxproj is a file only
# a machine writes and only a machine reads: it carries opaque identifiers,
# it reorders itself, and two people touching different targets still collide
# in it. Everything a reader needs to know about the build lives here instead.
#
# Regenerate with `xcodegen generate` after adding or moving a file.

options:
  bundleIdPrefix: dev.illvminat
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: none
  generateEmptyDirectories: false

# Documents that belong in the navigator but are built by nothing.
fileGroups:
  - SPEC.md
  - CLAUDE.md
  - README.md

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_NO_COMMON_BLOCKS: YES
    SDKROOT: macosx
    # Section 5.2 and the concurrency rules depend on this being complete,
    # not minimal: the watcher hands state across actors.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 5
    MARKETING_VERSION: "0.3.2"
    # Ad-hoc signing throughout. No restricted entitlement is used, so no
    # provisioning profile is involved and no team is needed — see SPEC 2.2
    # for why App Group was dropped and what that bought.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:

  CCWidget:
    type: application
    platform: macOS
    sources:
      # Icon Composer, two layers over an amber background: the vessel and
      # what is left in it. The sources are in Docs/icon/.
      #
      # It replaced a grey ring with a green arc — a gauge, which is the one
      # thing Apple's icon guidance asks not to draw: "don't just replicate
      # standard UI components". The vessel says the same thing without being
      # the component the widget itself draws.
      #
      # It belongs to the application and not to the extension. Measured: with
      # no icon of its own the extension is already served the app's icon by
      # the system, and giving it one — its own Assets.car, its own .icns, its
      # own CFBundleIconName — changed nothing anywhere that was looked at.
      - path: CCWidget.icon
      - path: App
        excludes: [Info.plist]
      - path: Shared
      # The window draws the same bars as the widget and reuses its entry
      # type; these two files are shared with the extension on purpose, the
      # rest of Widget/ is not.
      - path: Widget/Provider.swift
      - path: Widget/Components.swift
      # Tier 3: the estimate chart is the one thing whose correctness is a
      # shape rather than a string, so it is checked against pictures.
      - path: Widget/ForecastChart.swift
      - path: Scripts/ccwidget-export.py.template
        buildPhase: resources
      # Shipped inside the bundle so that `brew uninstall --cask` can undo the
      # configuration instead of deleting the app and leaving a statusLine
      # pointing at a file that is gone. A cask can run a script out of the
      # bundle it is removing; it cannot run one out of a git repository the
      # person may never have cloned.
      - path: Scripts/uninstall.sh
        buildPhase: resources
    # Xcode leaves Contents/Library behind after a copy-files phase that once
    # pointed there and no longer does. An empty directory inside a shipped
    # bundle is not a crime, but it is a leftover that suggests a helper this app
    # does not have — and the agent it was for turned out to be impossible.
    postBuildScripts:
      - name: Remove the empty Contents/Library
        script: |
          LIB="$TARGET_BUILD_DIR/$WRAPPER_NAME/Contents/Library"
          [ -d "$LIB" ] && find "$LIB" -type d -empty -delete || true
          true
        basedOnDependencyAnalysis: false
    dependencies:
      - target: CCWidgetExtension
        embed: true
        codeSign: false
        removeHeaders: true
      # Into Contents/MacOS, beside the app's own executable, which is where
      # the launchd plist below points.
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        # Names the icon inside CCWidget.icon. Without it the file is copied
        # into the bundle and never compiled, which looks like a build that
        # succeeded and an icon that did not appear.
        ASSETCATALOG_COMPILER_APPICON_NAME: CCWidget
        PRODUCT_BUNDLE_IDENTIFIER: dev.illvminat.ccwidget
        PRODUCT_NAME: CCWidget
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  CCWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: [Info.plist, CCWidgetExtension.entitlements]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/CCWidgetExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.illvminat.ccwidget.widget
        PRODUCT_NAME: CCWidgetExtension
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  # The checks compile the sources they exercise straight into the test
  # bundle instead of hosting the app. A hosted test bundle would have to
  # launch CCWidget.app, which embeds a widget extension and opens a window —
  # a GUI session's worth of machinery to check that a JSON key is edited in
  # place. Nothing here needs the app running.
  CCWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Baselines and fixtures are read from disk through #filePath, not from
      # the bundle: a baseline the checks compare against has to be the file in
      # the repository, and copying it into the bundle would mean comparing the
      # build's output with itself.
      - path: Tests
        excludes: [Baselines, Fixtures]
      - path: Shared
      - path: App/Installer.swift
      - path: App/SettingsEditor.swift
      - path: App/SnapshotWatcher.swift
      - path: App/StatusModel.swift
      - path: App/WindowState.swift
      - path: App/LoginItem.swift
      - path: App/CCWidgetApp.swift
      # The polarity rule from section 8 — the bar and the number beside it
      # describe the same quantity — lives in these two and is checkable
      # without rendering anything.
      - path: Widget/Provider.swift
      - path: Widget/Components.swift
      # Tier 3: the estimate chart is the one thing whose correctness is a
      # shape rather than a string, so it is checked against pictures.
      - path: Widget/ForecastChart.swift
      # The three tiles and the two screens. They were outside this target
      # until 17 August 2026, which is not "low coverage" but a structural
      # fact: 1617 lines that no check had ever executed, and the black medium
      # tile of 7 August lived in exactly that seam. WidgetKit's archiving step
      # still cannot be reproduced here — that is what Scripts/tile-probe.swift
      # is for — but what a tile is *made of* is checkable without it.
      - path: Widget/SmallView.swift
      - path: Widget/MediumView.swift
      - path: Widget/LargeView.swift
      - path: App/StatusView.swift
      - path: App/OnboardingView.swift
      # The exporter is checked by running it, so the checks need the same
      # template the app ships — not a copy that can drift away from it.
      - path: Scripts/ccwidget-export.py.template
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.illvminat.ccwidget.tests
        PRODUCT_NAME: CCWidgetTests

schemes:

  CCWidget:
    build:
      targets:
        CCWidget: all
        CCWidgetExtension: all
        CCWidgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - CCWidget
        - CCWidgetExtension
        - CCWidgetTests
      targets:
        - CCWidgetTests
    archive:
      config: Release

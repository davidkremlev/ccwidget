name: CCWidget

# The Xcode project is generated, not committed. A .pbxproj is a file only
# a machine writes and only a machine reads: it carries opaque identifiers,
# it reorders itself, and two people touching different targets still collide
# in it. Everything a reader needs to know about the build lives here instead.
#
# Regenerate with `xcodegen generate` after adding or moving a file.

options:
  bundleIdPrefix: dev.illvminat
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: none
  generateEmptyDirectories: false

# Documents that belong in the navigator but are built by nothing.
fileGroups:
  - SPEC.md
  - CLAUDE.md
  - README.md

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    COPY_PHASE_STRIP: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_STRICT_OBJC_MSGSEND: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GCC_NO_COMMON_BLOCKS: YES
    SDKROOT: macosx
    # Section 5.2 and the concurrency rules depend on this being complete,
    # not minimal: the watcher hands state across actors.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "0.2"
    # Ad-hoc signing throughout. No restricted entitlement is used, so no
    # provisioning profile is involved and no team is needed — see SPEC 2.2
    # for why App Group was dropped and what that bought.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule

targets:

  CCWidget:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Shared
      # The window draws the same bars as the widget and reuses its entry
      # type; these two files are shared with the extension on purpose, the
      # rest of Widget/ is not.
      - path: Widget/Provider.swift
      - path: Widget/Components.swift
      - path: Scripts/ccwidget-export.py.template
        buildPhase: resources
    dependencies:
      - target: CCWidgetExtension
        embed: true
        codeSign: false
        removeHeaders: true
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.illvminat.ccwidget
        PRODUCT_NAME: CCWidget
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"

  CCWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
        excludes: [Info.plist, CCWidgetExtension.entitlements]
      - path: Shared
    settings:
      base:
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/CCWidgetExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: dev.illvminat.ccwidget.widget
        PRODUCT_NAME: CCWidgetExtension
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

schemes:

  CCWidget:
    build:
      targets:
        CCWidget: all
        CCWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
